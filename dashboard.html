<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人員構成ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background: #f0f2f5; color: #1a1a2e; }
  header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: .05em; }
  header span.date { font-size: .8rem; opacity: .7; }
  /* Filter bar */
  .filter-bar { background: white; padding: 8px 24px 10px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .filter-row + .filter-row { border-top: 1px solid #f0f0f0; margin-top: 6px; padding-top: 8px; }
  .filter-label { font-size: .78rem; color: #888; font-weight: 700; white-space: nowrap; min-width: 2em; }
  .filter-sep { color: #c0bfff; font-size: .9rem; padding: 0 2px; }
  .reset-btn { padding: 6px 14px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-size: .8rem; cursor: pointer; font-weight: 600; margin-left: auto; }
  .reset-btn:hover { background: #3730a3; }
  /* MultiSelect */
  .ms-wrapper { position: relative; display: inline-block; }
  .ms-btn { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: .82rem; background: white; cursor: pointer; white-space: nowrap; max-width: 210px; font-family: inherit; color: #555; }
  .ms-btn-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
  .ms-btn-arrow { color: #bbb; font-size: .65rem; flex-shrink: 0; }
  .ms-btn.ms-active { border-color: #4f46e5; color: #4f46e5; background: #eef2ff; }
  .ms-btn.ms-active .ms-btn-arrow { color: #4f46e5; }
  .ms-dropdown { position: absolute; top: calc(100% + 4px); left: 0; min-width: 190px; max-width: 280px; background: white; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.13); z-index: 9999; overflow: hidden; }
  .ms-dropdown.ms-hidden { display: none; }
  .ms-hd { display: flex; gap: 6px; padding: 7px 10px; border-bottom: 1px solid #f0f0f0; background: #fafafa; }
  .ms-hd button { font-size: .72rem; padding: 2px 8px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: white; color: #555; font-family: inherit; }
  .ms-hd button:hover { background: #efefef; }
  .ms-items { max-height: 230px; overflow-y: auto; }
  .ms-item { display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; font-size: .83rem; color: #333; }
  .ms-item:hover { background: #f5f5ff; }
  .ms-item input[type=checkbox] { accent-color: #4f46e5; flex-shrink: 0; cursor: pointer; }
  .ms-empty { padding: 14px; font-size: .8rem; color: #bbb; text-align: center; }
  /* Cards */
  .container { padding: 16px 24px; max-width: 1600px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .card { background: white; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); border-left: 4px solid #4f46e5; }
  .card .lbl { font-size: .75rem; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .card .val { font-size: 2rem; font-weight: 800; color: #1a1a2e; margin-top: 4px; }
  .card .sub { font-size: .75rem; color: #aaa; margin-top: 2px; }
  .card:nth-child(2) { border-left-color: #3b82f6; }
  .card:nth-child(3) { border-left-color: #ec4899; }
  .card:nth-child(4) { border-left-color: #10b981; }
  .card:nth-child(5) { border-left-color: #f59e0b; }
  /* Charts */
  .charts-grid  { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 16px; margin-bottom: 16px; }
  .charts-grid2 { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 16px; }
  .chart-box { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .chart-box h3 { font-size: .85rem; font-weight: 700; color: #444; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; }
  canvas { max-height: 240px; }
  .tall canvas { max-height: 320px; }
  #count-badge { font-size: .75rem; background: #eef2ff; color: #4f46e5; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-weight: 600; }
  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(3,1fr); }
    .charts-grid, .charts-grid2 { grid-template-columns: 1fr; }
    canvas { max-height: 200px; }
  }
</style>
</head>
<body>

<header>
  <h1>人員構成ダッシュボード<span id="count-badge">219名</span></h1>
  <span class="date">基準日：2026年4月9日</span>
</header>

<div class="filter-bar">
  <div class="filter-row">
    <span class="filter-label">組織</span>
    <div id="ms-org2"></div>
    <span class="filter-sep">›</span>
    <div id="ms-org4"></div>
    <span class="filter-sep">›</span>
    <div id="ms-org5"></div>
  </div>
  <div class="filter-row">
    <span class="filter-label">属性</span>
    <div id="ms-gender"></div>
    <div id="ms-grade"></div>
    <div id="ms-position"></div>
    <button class="reset-btn" onclick="resetFilters()">リセット</button>
  </div>
</div>

<div class="container">
  <div class="cards">
    <div class="card"><div class="lbl">総人数</div><div class="val" id="c-total">-</div><div class="sub">全メンバー</div></div>
    <div class="card"><div class="lbl">男性</div><div class="val" id="c-male">-</div><div class="sub" id="c-male-r">-</div></div>
    <div class="card"><div class="lbl">女性</div><div class="val" id="c-female">-</div><div class="sub" id="c-female-r">-</div></div>
    <div class="card"><div class="lbl">平均年齢</div><div class="val" id="c-avgage">-</div><div class="sub">歳</div></div>
    <div class="card"><div class="lbl">平均勤続</div><div class="val" id="c-tenure">-</div><div class="sub">年</div></div>
  </div>
  <div class="charts-grid">
    <div class="chart-box"><h3>性別構成</h3><canvas id="ch-gender"></canvas></div>
    <div class="chart-box tall"><h3>年代別・性別分布（人口ピラミッド）</h3><canvas id="ch-pyramid"></canvas></div>
    <div class="chart-box tall"><h3>局別人数（性別内訳）</h3><canvas id="ch-org2"></canvas></div>
  </div>
  <div class="charts-grid2" style="margin-top:0;">
    <div class="chart-box"><h3>等級別分布（性別内訳）</h3><canvas id="ch-grade"></canvas></div>
    <div class="chart-box"><h3>職位別分布</h3><canvas id="ch-position"></canvas></div>
    <div class="chart-box"><h3>入職年別推移</h3><canvas id="ch-hire"></canvas></div>
  </div>
</div>

class MultiSelect {
  constructor(containerId, placeholder, onChange) {
    this.selected = new Set();
    this.options = [];
    this.placeholder = placeholder;
    this.onChange = onChange;
    const container = document.getElementById(containerId);
    this.wrapper = document.createElement('div');
    this.wrapper.className = 'ms-wrapper';
    this.btn = document.createElement('button');
    this.btn.type = 'button';
    this.btn.className = 'ms-btn';
    this.btnText = document.createElement('span');
    this.btnText.className = 'ms-btn-text';
    this.btnText.textContent = placeholder;
    const arrow = document.createElement('span');
    arrow.className = 'ms-btn-arrow';
    arrow.textContent = '▾';
    this.btn.append(this.btnText, arrow);
    this.dropdown = document.createElement('div');
    this.dropdown.className = 'ms-dropdown ms-hidden';
    this.wrapper.append(this.btn, this.dropdown);
    container.append(this.wrapper);
    this.btn.addEventListener('click', e => {
      e.stopPropagation();
      const hidden = this.dropdown.classList.contains('ms-hidden');
      document.querySelectorAll('.ms-dropdown').forEach(d => d.classList.add('ms-hidden'));
      if (hidden) this.dropdown.classList.remove('ms-hidden');
    });
    document.addEventListener('click', () => this.dropdown.classList.add('ms-hidden'));
    this.dropdown.addEventListener('click', e => e.stopPropagation());
  }
  setOptions(options, keepSelected = false) {
    if (!keepSelected) this.selected.clear();
    else for (const s of [...this.selected]) if (!options.includes(s)) this.selected.delete(s);
    this.options = [...options];
    this._render();
    this._updateBtn();
  }
  _render() {
    this.dropdown.innerHTML = '';
    if (!this.options.length) {
      const e = document.createElement('div');
      e.className = 'ms-empty';
      e.textContent = '選択肢がありません';
      this.dropdown.append(e);
      return;
    }
    const hd = document.createElement('div');
    hd.className = 'ms-hd';
    const btnAll = document.createElement('button');
    btnAll.type = 'button'; btnAll.textContent = 'すべて選択';
    btnAll.onclick = () => { this.options.forEach(o => this.selected.add(o)); this._renderItems(); this._updateBtn(); this.onChange(); };
    const btnClear = document.createElement('button');
    btnClear.type = 'button'; btnClear.textContent = 'クリア';
    btnClear.onclick = () => { this.selected.clear(); this._renderItems(); this._updateBtn(); this.onChange(); };
    hd.append(btnAll, btnClear);
    this.itemsEl = document.createElement('div');
    this.itemsEl.className = 'ms-items';
    this.dropdown.append(hd, this.itemsEl);
    this._renderItems();
  }
  _renderItems() {
    this.itemsEl.innerHTML = '';
    this.options.forEach(opt => {
      const lbl = document.createElement('label');
      lbl.className = 'ms-item';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = this.selected.has(opt);
      cb.onchange = () => { cb.checked ? this.selected.add(opt) : this.selected.delete(opt); this._updateBtn(); this.onChange(); };
      lbl.append(cb, document.createTextNode(opt));
      this.itemsEl.append(lbl);
    });
  }
  _updateBtn() {
    const n = this.selected.size;
    if (n === 0) { this.btnText.textContent = this.placeholder; this.btn.classList.remove('ms-active'); }
    else {
      const items = [...this.selected];
      this.btnText.textContent = n <= 2 ? items.join('・') : items.slice(0,2).join('・') + ` +${n-2}`;
      this.btn.classList.add('ms-active');
    }
  }
  getSelected() { return [...this.selected]; }
  reset() { this.selected.clear(); if (this.itemsEl) this._renderItems(); this._updateBtn(); }
}

function onOrg2Change() {
  const sel2 = msOrg2.getSelected();
  const base = sel2.length ? RAW.filter(r=>sel2.includes(r.org2)) : RAW;
  msOrg4.setOptions([...new Set(base.map(r=>r.org4).filter(Boolean))].sort(), true);
  onOrg4Change();
}
function onOrg4Change() {
  const sel2 = msOrg2.getSelected(), sel4 = msOrg4.getSelected();
  const base = RAW.filter(r=>(!sel2.length||sel2.includes(r.org2))&&(!sel4.length||sel4.includes(r.org4)));
  msOrg5.setOptions([...new Set(base.map(r=>r.org5).filter(Boolean))].sort(), true);
  update();
}
function resetFilters() {
  msOrg2.reset(); msOrg4.setOptions(allOrg4); msOrg5.setOptions(allOrg5);
  msGender.reset(); msGrade.reset(); msPosition.reset();
  update();
}
function getFiltered() {
  const s2=msOrg2.getSelected(), s4=msOrg4.getSelected(), s5=msOrg5.getSelected();
  const sg=msGender.getSelected(), sgr=msGrade.getSelected(), sp=msPosition.getSelected();
  return RAW.filter(r=>
    (!s2.length||s2.includes(r.org2))&&(!s4.length||s4.includes(r.org4))&&(!s5.length||s5.includes(r.org5))&&
    (!sg.length||sg.includes(r.gender))&&(!sgr.length||sgr.includes(r.grade))&&(!sp.length||sp.includes(r.position))
  );
}

let charts = {};
function makeChart(id, cfg) { if(charts[id]) charts[id].destroy(); charts[id]=new Chart(document.getElementById(id),cfg); }
function cnt(arr,k,v) { return arr.filter(r=>r[k]===v).length; }
function avg(arr,k) { const v=arr.map(r=>r[k]).filter(x=>x!=null); return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-'; }

  makeChart('ch-org2',{type:'bar',
    data:{labels:orgList,datasets:[
      {label:'男性',data:orgList.map(o=>cnt(d.filter(r=>r.org2===o),'gender','男性')),backgroundColor:MALE_C,borderRadius:3},
      {label:'女性',data:orgList.map(o=>cnt(d.filter(r=>r.org2===o),'gender','女性')),backgroundColor:FEMALE_C,borderRadius:3}
    ]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}},
      scales:{x:{stacked:true,title:{display:true,text:'人数'}},y:{stacked:true,ticks:{font:{size:11}}}}
    }
  });

  const gl=GRADE_ORDER.filter(g=>RAW.some(r=>r.grade===g));
  makeChart('ch-grade',{type:'bar',
    data:{labels:gl,datasets:[
      {label:'男性',data:gl.map(g=>cnt(d.filter(r=>r.grade===g),'gender','男性')),backgroundColor:MALE_C,borderRadius:4},
      {label:'女性',data:gl.map(g=>cnt(d.filter(r=>r.grade===g),'gender','女性')),backgroundColor:FEMALE_C,borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true,title:{display:true,text:'人数'}}}}
  });

  const pl=[...new Set(d.map(r=>r.position).filter(Boolean))].sort((a,b)=>(posOrder.indexOf(a)+1||99)-(posOrder.indexOf(b)+1||99));
  makeChart('ch-position',{type:'bar',
    data:{labels:pl,datasets:[{label:'人数',data:pl.map(p=>cnt(d,'position',p)),backgroundColor:ORG_COLORS,borderRadius:4}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'人数'}},y:{ticks:{font:{size:11}}}}}
  });

  const hy=d.map(r=>r.hire_year).filter(Boolean);
  if(hy.length){
    const minY=Math.min(...hy),maxY=Math.max(...hy);
    const yrs=Array.from({length:maxY-minY+1},(_,i)=>minY+i);
    makeChart('ch-hire',{type:'bar',
      data:{labels:yrs,datasets:[
        {label:'男性',data:yrs.map(y=>d.filter(r=>r.hire_year===y&&r.gender==='男性').length),backgroundColor:MALE_C},
        {label:'女性',data:yrs.map(y=>d.filter(r=>r.hire_year===y&&r.gender==='女性').length),backgroundColor:FEMALE_C}
      ]},
      options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true,ticks:{maxRotation:45,font:{size:10}}},y:{stacked:true,title:{display:true,text:'人数'}}}}
    });
  }
}

update();
</script>
</body>
</html>
