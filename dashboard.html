<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人員構成ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background: #f0f2f5; color: #1a1a2e; }
  header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: .05em; }
  header span { font-size: .8rem; opacity: .7; }
  .filter-bar { background: white; padding: 12px 24px; display: flex; gap: 16px; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.1); flex-wrap: wrap; }
  .filter-bar label { font-size: .8rem; color: #666; font-weight: 600; }
  .filter-bar select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: .85rem; background: white; cursor: pointer; }
  .filter-bar select:focus { outline: none; border-color: #4f46e5; }
  .filter-bar button { padding: 6px 14px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-size: .8rem; cursor: pointer; font-weight: 600; }
  .filter-bar button:hover { background: #3730a3; }
  .container { padding: 16px 24px; max-width: 1600px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .card { background: white; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); border-left: 4px solid #4f46e5; }
  .card .label { font-size: .75rem; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .card .value { font-size: 2rem; font-weight: 800; color: #1a1a2e; margin-top: 4px; }
  .card .sub { font-size: .75rem; color: #aaa; margin-top: 2px; }
  .card:nth-child(2) { border-left-color: #3b82f6; }
  .card:nth-child(3) { border-left-color: #ec4899; }
  .card:nth-child(4) { border-left-color: #10b981; }
  .card:nth-child(5) { border-left-color: #f59e0b; }
  .charts-grid { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: 16px; margin-bottom: 16px; }
  .charts-grid2 { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 16px; }
  .chart-box { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .chart-box h3 { font-size: .85rem; font-weight: 700; color: #444; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0; }
  canvas { max-height: 240px; }
  .tall canvas { max-height: 320px; }
  #count-badge { font-size: .75rem; background: #eef2ff; color: #4f46e5; padding: 2px 8px; border-radius: 10px; margin-left: 8px; font-weight: 600; }
  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
    .charts-grid, .charts-grid2 { grid-template-columns: 1fr; }
    canvas { max-height: 200px; }
  }
</style>
</head>
<body>

<header>
  <h1>人員構成ダッシュボード<span id="count-badge">219名</span></h1>
  <span>基準日：2026年4月9日</span>
</header>

<div class="filter-bar">
  <label>局・組織</label>
  <select id="f-org2"><option value="">すべて</option></select>
  <label>性別</label>
  <select id="f-gender"><option value="">すべて</option><option value="男性">男性</option><option value="女性">女性</option></select>
  <label>等級</label>
  <select id="f-grade"><option value="">すべて</option></select>
  <label>職位</label>
  <select id="f-position"><option value="">すべて</option></select>
  <button onclick="resetFilters()">リセット</button>
</div>

<div class="container">
  <div class="cards">
    <div class="card"><div class="label">総人数</div><div class="value" id="c-total">-</div><div class="sub">全メンバー</div></div>
    <div class="card"><div class="label">男性</div><div class="value" id="c-male">-</div><div class="sub" id="c-male-r">-</div></div>
    <div class="card"><div class="label">女性</div><div class="value" id="c-female">-</div><div class="sub" id="c-female-r">-</div></div>
    <div class="card"><div class="label">平均年齢</div><div class="value" id="c-avgage">-</div><div class="sub">歳</div></div>
    <div class="card"><div class="label">平均勤続</div><div class="value" id="c-tenure">-</div><div class="sub">年</div></div>
  </div>

  <div class="charts-grid">
    <div class="chart-box"><h3>性別構成</h3><canvas id="ch-gender"></canvas></div>
    <div class="chart-box tall"><h3>年代別・性別分布（人口ピラミッド）</h3><canvas id="ch-pyramid"></canvas></div>
    <div class="chart-box tall"><h3>局別人数（性別内訳）</h3><canvas id="ch-org2"></canvas></div>
  </div>

  <div class="charts-grid2" style="margin-top:0;">
    <div class="chart-box"><h3>等級別分布（性別内訳）</h3><canvas id="ch-grade"></canvas></div>
    <div class="chart-box"><h3>職位別分布</h3><canvas id="ch-position"></canvas></div>
    <div class="chart-box"><h3>入職年別推移</h3><canvas id="ch-hire"></canvas></div>
  </div>
</div>

const GRADE_ORDER = ['M1','M2','M3','M4','S1','S2','S3'];
const AGE_LABELS = ['20代前半','20代後半','30代前半','30代後半','40代前半','40代後半','50代前半','50代後半','60代前半','60代後半'];
const AGE_STEPS  = [20,25,30,35,40,45,50,55,60,65,70];
const MALE_COLOR   = 'rgba(59,130,246,0.85)';
const FEMALE_COLOR = 'rgba(236,72,153,0.85)';
const MALE_BG      = 'rgba(59,130,246,0.2)';
const FEMALE_BG    = 'rgba(236,72,153,0.2)';
const ORG_COLORS   = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#eab308','#22c55e'];

// populate filters
const orgs = [...new Set(RAW.map(r=>r.org2).filter(Boolean))].sort();
orgs.forEach(o=>{ let op=document.createElement('option'); op.value=o; op.textContent=o; document.getElementById('f-org2').append(op); });
GRADE_ORDER.forEach(g=>{ if(RAW.some(r=>r.grade===g)){ let op=document.createElement('option'); op.value=g; op.textContent=g; document.getElementById('f-grade').append(op); } });
const positions = [...new Set(RAW.map(r=>r.position).filter(Boolean))].sort();
positions.forEach(p=>{ let op=document.createElement('option'); op.value=p; op.textContent=p; document.getElementById('f-position').append(op); });

// filter
function getFiltered() {
  const org2 = document.getElementById('f-org2').value;
  const gender = document.getElementById('f-gender').value;
  const grade = document.getElementById('f-grade').value;
  const position = document.getElementById('f-position').value;
  return RAW.filter(r =>
    (!org2 || r.org2===org2) &&
    (!gender || r.gender===gender) &&
    (!grade || r.grade===grade) &&
    (!position || r.position===position)
  );
}

function resetFilters() {
  ['f-org2','f-gender','f-grade','f-position'].forEach(id=>document.getElementById(id).value='');
  update();
}

['f-org2','f-gender','f-grade','f-position'].forEach(id=>document.getElementById(id).addEventListener('change',update));

// charts
let charts = {};
function makeChart(id, cfg) {
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), cfg);
}

function count(arr, key, val) { return arr.filter(r=>r[key]===val).length; }
function avg(arr, key) { const v=arr.map(r=>r[key]).filter(x=>x!=null); return v.length? (v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-'; }

function update() {
  const d = getFiltered();
  const n = d.length;
  document.getElementById('count-badge').textContent = n+'名';

  // cards
  const male = count(d,'gender','男性'), female = count(d,'gender','女性');
  document.getElementById('c-total').textContent = n;
  document.getElementById('c-male').textContent = male;
  document.getElementById('c-male-r').textContent = n? (male/n*100).toFixed(1)+'%' : '-';
  document.getElementById('c-female').textContent = female;
  document.getElementById('c-female-r').textContent = n? (female/n*100).toFixed(1)+'%' : '-';
  document.getElementById('c-avgage').textContent = avg(d,'age');
  const tenure2026 = d.map(r=>r.hire_year? 2026-r.hire_year:null);
  const tv = tenure2026.filter(x=>x!=null);
  document.getElementById('c-tenure').textContent = tv.length? (tv.reduce((a,b)=>a+b,0)/tv.length).toFixed(1):'-';

  // gender donut
  makeChart('ch-gender', {
    type:'doughnut',
    data:{ labels:['男性','女性'], datasets:[{ data:[male,female], backgroundColor:[MALE_COLOR,FEMALE_COLOR], borderWidth:2 }] },
    options:{ plugins:{ legend:{ position:'bottom' }, tooltip:{ callbacks:{ label: ctx=>` ${ctx.label}: ${ctx.raw}名 (${n?(ctx.raw/n*100).toFixed(1):0}%)` } } }, cutout:'60%', responsive:true, maintainAspectRatio:true }
  });

  // pyramid
  const ageGroups = AGE_STEPS.slice(0,-1).map((min,i)=>{
    const max=AGE_STEPS[i+1];
    const m = d.filter(r=>r.gender==='男性'&&r.age>=min&&r.age<max).length;
    const f = d.filter(r=>r.gender==='女性'&&r.age>=min&&r.age<max).length;
    return {label:AGE_LABELS[i],m,f};
  }).reverse();
  makeChart('ch-pyramid', {
    type:'bar',
    data:{ labels:ageGroups.map(g=>g.label),
      datasets:[
        { label:'男性', data:ageGroups.map(g=>-g.m), backgroundColor:MALE_COLOR, borderRadius:3 },
        { label:'女性', data:ageGroups.map(g=>g.f), backgroundColor:FEMALE_COLOR, borderRadius:3 }
      ]
    },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom' }, tooltip:{ callbacks:{ label: ctx=>` ${ctx.dataset.label}: ${Math.abs(ctx.raw)}名` } } },
      scales:{ x:{ ticks:{ callback: v=>Math.abs(v) }, title:{ display:true,text:'人数' } }, y:{ ticks:{ font:{ size:11 } } } }
    }
  });

  // org2 stacked
  const orgList = [...new Set(d.map(r=>r.org2).filter(Boolean))].sort();
  const orgM = orgList.map(o=>count(d.filter(r=>r.org2===o),'gender','男性'));
  const orgF = orgList.map(o=>count(d.filter(r=>r.org2===o),'gender','女性'));
  makeChart('ch-org2', {
    type:'bar',
    data:{ labels:orgList,
      datasets:[
        { label:'男性', data:orgM, backgroundColor:MALE_COLOR, borderRadius:3 },
        { label:'女性', data:orgF, backgroundColor:FEMALE_COLOR, borderRadius:3 }
      ]
    },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom' } },
      scales:{ x:{ stacked:true, title:{ display:true,text:'人数' } }, y:{ stacked:true, ticks:{ font:{ size:11 } } } }
    }
  });

  // grade
  const gradeList = GRADE_ORDER.filter(g=>RAW.some(r=>r.grade===g));
  const gradeM = gradeList.map(g=>count(d.filter(r=>r.grade===g),'gender','男性'));
  const gradeF = gradeList.map(g=>count(d.filter(r=>r.grade===g),'gender','女性'));
  makeChart('ch-grade', {
    type:'bar',
    data:{ labels:gradeList,
      datasets:[
        { label:'男性', data:gradeM, backgroundColor:MALE_COLOR, borderRadius:4 },
        { label:'女性', data:gradeF, backgroundColor:FEMALE_COLOR, borderRadius:4 }
      ]
    },
    options:{ responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ position:'bottom' } },
      scales:{ x:{ stacked:true }, y:{ stacked:true, title:{ display:true,text:'人数' } } }
    }
  });

  // position
  const posList = [...new Set(d.map(r=>r.position).filter(Boolean))].sort((a,b)=>{
    const order=['局長','部長','課長','課長補佐','事務員','養護職員'];
    return (order.indexOf(a)+1||99)-(order.indexOf(b)+1||99);
  });
  const posCount = posList.map(p=>count(d,'position',p));
  makeChart('ch-position', {
    type:'bar',
    data:{ labels:posList, datasets:[{ label:'人数', data:posCount, backgroundColor:ORG_COLORS, borderRadius:4 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ display:false } },
      scales:{ x:{ title:{ display:true,text:'人数' } }, y:{ ticks:{ font:{ size:11 } } } }
    }
  });

  // hire year
  const hireYears = d.map(r=>r.hire_year).filter(Boolean);
  const minY = Math.min(...hireYears), maxY = Math.max(...hireYears);
  const years = Array.from({length:maxY-minY+1},(_,i)=>minY+i);
  const hireM = years.map(y=>d.filter(r=>r.hire_year===y&&r.gender==='男性').length);
  const hireF = years.map(y=>d.filter(r=>r.hire_year===y&&r.gender==='女性').length);
  makeChart('ch-hire', {
    type:'bar',
    data:{ labels:years,
      datasets:[
        { label:'男性', data:hireM, backgroundColor:MALE_COLOR },
        { label:'女性', data:hireF, backgroundColor:FEMALE_COLOR }
      ]
    },
    options:{ responsive:true, maintainAspectRatio:true,
      plugins:{ legend:{ position:'bottom' } },
      scales:{ x:{ stacked:true, ticks:{ maxRotation:45, font:{ size:10 } } }, y:{ stacked:true, title:{ display:true,text:'人数' } } }
    }
  });
}

update();
</script>
